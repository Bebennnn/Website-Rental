
name: VeloDrive CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    working-directory: velodrive

env:
  NODE_VERSION: 22

jobs:
  # Stage 1: install & cache prime
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies
        run: npm ci

  # Stage 2: lint
  lint:
    name: Code linting
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci

      - name: Run linting
        run: npm run lint

  # Stage 3: audit
  audit:
    name: Dependency security audit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

  # Stage 4: test
  test:
    name: Unit tests and coverage
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Run backend tests
        run: node --test backend/src/services/customer.service.test.js

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: velodrive/coverage
          retention-days: 14

  # Stage 5: build
  build:
    name: Build application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: velodrive/dist
          retention-days: 7

  # Stage 6: sonarqube
  sonarqube:
    name: SonarQube analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: velodrive/package-lock.json

      - name: Install dependencies (cached)
        run: npm ci

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: velodrive/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: velodrive
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
